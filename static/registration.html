<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>bee.кетики - Регистрация</title>
        <link rel="stylesheet" href="base.css">
        <link rel="stylesheet" href="reg.css">
    </head>
    <body class="auth-page">
        <main>
            <h1 id = "h1_registration" class = "head_h1">Регистрaция</h1>
            <div class = "transition" id = "transition_to_login">
                <p id = "p_logIn">Уже зарегестрированы?</p>
                <p class = "link" id = "logIn_link">Войти</p> <!--ссылка на вход-->
            </div>
            <form id = "Form">
                <label for="lastname">Ваша фамилия:</label>
                <input type="text" id="lastname" placeholder="Фамилия" required>

                <label for="firstname">Ваше Имя:</label>
                <input type="text" id="firstname" placeholder="Имя" required>

                <label for="phone">Номер телефона:</label>
                <input type="tel" id="phone" placeholder="+7 000 000 00 00" required>

                <label for="email">Электронная почта:</label>
                <input type="email" id="email" placeholder="Имя" required>

                <label for="password">Пароль:</label>
                <input type="password" id="password" placeholder="******" required>
                
                <button id = "reg-button" class = "reg-log-btn">Зарегестрироваться</button>
            </form>
        </main>
        
        <script type="module" src = "registration.js"></script>
    </body>
</html>
